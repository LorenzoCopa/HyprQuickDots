# Tamaño de fuente
font_size 14

# Configuración de fuente
font_family IosevkaTerm NF

# Pegar
map ctrl+v paste_from_clipboard

# Copiar la selección
copy_on_select yes

# --- Colores: Tokyo Night (Night) ---
background #1a1b26
foreground #c0caf5
cursor #c0caf5
selection_background #33467c
selection_foreground #c0caf5

# Colores básicos
color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6

# Colores brillantes
color8 #414868
color9 #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# --- Tab bar ---
# tab_bar_edge top
# tab_bar_align center
# tab_bar_style separator
# tab_separator "   "
# tab_bar_min_tabs 2
# tab_title_template "{index}"
# active_tab_font_style bold
# inactive_tab_font_style normal
# active_tab_foreground #CBE3B3
# inactive_tab_foreground #5C6B6E
# active_tab_background #232A2E
# inactive_tab_background #232A2E

# --- Layout ---
enabled_layouts splits

# # --- Navegación entre panes (Alt + hjkl) ---
# map alt+h neighboring_window left
# map alt+j neighboring_window down
# map alt+k neighboring_window up
# map alt+l neighboring_window right
#
# # --- Navegación entre tabs (Alt + 1-9) ---
# map alt+1 goto_tab 1
# map alt+2 goto_tab 2
# map alt+3 goto_tab 3
# map alt+4 goto_tab 4
# map alt+5 goto_tab 5
# map alt+6 goto_tab 6
# map alt+7 goto_tab 7
# map alt+8 goto_tab 8
# map alt+9 goto_tab 9

# --- Crear nuevos panes y tabs ---
map alt+p launch --location=vsplit --cwd=current
map alt+t launch --type=tab --cwd=current
map alt+g launch --location=hsplit --cwd=current

# --- Cerrar pane / tab ---
map alt+x close_window
map alt+w close_tab

# Abrir editor
scrollback_pager sh -c 'perl -pe "s/\e\[[0-9;:]*[a-zA-Z]//g; s/\e\].*?(\e\\\\|\a)//g" | grep . | nvim -R -c "set buftype=nofile filetype=text nonumber norelativenumber" -c "nnoremap <silent> q :qa!<CR>" -c "normal G" -'

# Espacios
window_padding_width 0 0 0 0
# placement_strategy top-left
placement_strategy center
