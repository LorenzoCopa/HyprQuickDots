# Detección automática de jack para la tarjeta interna (HDA Intel PCH /
# Realtek ALC887-VD). Sin esta regla WirePlumber fija la ruta de entrada en
# "front-mic" (api.acp.auto-port = false) y no cambia al conectar el
# micrófono en el jack trasero. Con auto-port = true reacciona a la
# inserción y alterna entre Micrófono frontal (device 0) y Alt Analog
# (device 2) por sí solo.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        api.acp.auto-port = true
      }
    }
  }
]
